<body>

    <span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776;</span>

    <!-- Buttons for updating and transition -->
    <button id="updateButton">Update Data</button>
    <button id="easeInOutButton">Ease In/Out Transition</button>

    <script>
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }

        var w = 500;
        var h = 300;
        var barPadding = 0.05;  // Padding between bars
        var maxValue = 25;

        var dataset = [14, 5, 26, 23, 9, 21, 7, 19, 28, 16, 15, 24];

        // Scalable x-axis using scaleBand
        var xScale = d3.scaleBand()
            .domain(d3.range(dataset.length))
            .rangeRound([0, w])
            .paddingInner(barPadding);

        // Scalable y-axis using scaleLinear
        var yScale = d3.scaleLinear()
            .domain([0, d3.max(dataset)])
            .range([h, 0]);

        // Create SVG container
        var svg = d3.select("body")
            .append("svg")
            .attr("width", w)
            .attr("height", h);

        // Function to draw bars with transitions
        function drawBars(data, duration = 1000, easing = d3.easeCubicInOut) {
            svg.selectAll("rect")
                .data(data)
                .join("rect")
                .transition()  // Add smooth transition
                .duration(duration)
                .ease(easing)
                .attr("x", (d, i) => xScale(i))
                .attr("y", d => yScale(d))
                .attr("width", xScale.bandwidth())
                .attr("height", d => h - yScale(d))
                .attr("fill", "black");

            // Add labels on top of bars
            svg.selectAll("text")
                .data(data)
                .join("text")
                .text(d => d)
                .transition()
                .duration(duration)
                .ease(easing)
                .attr("x", (d, i) => xScale(i) + xScale.bandwidth() / 2)
                .attr("y", d => yScale(d) + 15)
                .attr("font-size", "12px")
                .attr("fill", "white")
                .attr("text-anchor", "middle");
        }

        // Draw initial chart
        drawBars(dataset);

        // Button to update data with default transition
        d3.select("#updateButton").on("click", function () {
            var numValues = dataset.length;
            dataset = [];
            for (var i = 0; i < numValues; i++) {
                var newNumber = Math.floor(Math.random() * maxValue);
                dataset.push(newNumber);
            }

            // Update yScale domain
            yScale.domain([0, d3.max(dataset)]);

            // Redraw bars with new data
            drawBars(dataset);
        });

        // Button for easeInOut transition
        d3.select("#easeInOutButton").on("click", function () {
            var numValues = dataset.length;
            dataset = [];
            for (var i = 0; i < numValues; i++) {
                var newNumber = Math.floor(Math.random() * maxValue);
                dataset.push(newNumber);
            }

            // Update yScale domain
            yScale.domain([0, d3.max(dataset)]);

            // Redraw with Ease In/Out transition and 2000 ms duration
            drawBars(dataset, 2000, d3.easeElasticOut);
        });
    </script>
