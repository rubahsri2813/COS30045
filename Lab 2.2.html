    <h1>Drawing with Data</h1>

    <script>
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
    </script>
    <script>
        // Set SVG dimensions
        var w = 500;
        var h = 200;
        var padding = 5;

        // Sample data
        var dataset = [14, 32, 54, 12, 22];

        // Create SVG element
        var svg = d3.select("body")
            .append("svg")
            .attr("width", w)
            .attr("height", h);

        // Scale the bar heights
        var heightScale = d3.scaleLinear()
            .domain([0, d3.max(dataset)])
            .range([0, h]);

        // Create bars
        svg.selectAll("rect")
            .data(dataset)
            .enter()
            .append("rect")
            .attr("class", "bar")
            .attr("x", function(d, i) {
                return i * (w / dataset.length);
            })
            .attr("y", function(d) {
                return h - heightScale(d);
            })
            .attr("width", (w / dataset.length) - padding)
            .attr("height", function(d) {
                return heightScale(d);
            });

    </script>
    <footer><br>COS30045 Data Visualisation<br>Ruby</footer>
</body>
</html>
