    <h1>Creating and Formatting Paragraph Elements with D3 </h1>

    <script>
        var w = 500;
        var h = 200;
        var barPadding = 1; 
        var padding = 20;  // Defining padding for the chart

        // dataset for scatter plot
        var dataset = [
            [5, 20],
            [480, 90],
            [250, 50],
            [100, 33],
            [330, 95],
            [410, 12],
            [475, 44],
            [25, 67],
            [85, 21],
            [220, 88],
        ];

        var xScale = d3.scaleLinear()
            .domain([d3.min(dataset, function(d) { return d[0]; }),
                     d3.max(dataset, function(d) { return d[0]; })
            ])
            .range([padding, w - padding]);

        var yScale = d3.scaleLinear()
            .domain([0, d3.max(dataset, function(d) { return d[1]; })])
            .range([h - padding, padding]);  // Added yScale for chart

        var svg = d3.select("body")
            .append("svg")
            .attr("width", w)
            .attr("height", h);

        svg.selectAll("circle")
            .data(dataset)
            .enter()
            .append("circle")
            .attr("cx", function(d) {
                return xScale(d[0]);
            })
            .attr("cy", function(d) {
                return yScale(d[1]);  // return y value
            })
            .attr("r", function(d) {
                return Math.sqrt(d[1]);
            })
            .attr("fill", "brown");

        svg.selectAll("text")
            .data(dataset)
            .enter()
            .append("text")
            .text(function(d) {
                return d[0] + ", " + d[1];
            })
            .attr("x", function(d) {
                return xScale(d[0]);
            })
            .attr("y", function(d) {
                return yScale(d[1]) - 10;  // Position the text slightly above the circle
            })
            .attr("font-family", "sans-serif")
            .attr("font-size", "11px")
            .attr("fill", "red");
    </script>
