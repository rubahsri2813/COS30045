    <h1>Drawing Shapes with SVG</h1>

    <!--This is the SVG part-->

    <svg width="500" height="60" style="background-color: bisque">
        <g transform="translate(20, 0)">
            <!--The SVG contains a circle, rectangle, ellipse and a line-->
