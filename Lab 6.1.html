        <button id="addButton">Add Data</button>
        <button id="removeButton">Remove Data</button>

        <script>
            function openNav() {
                document.getElementById("mySidenav").style.width = "250px";
            }

            function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
            }
            
        </script>
        <script>
            
            var w = 500;
            var h = 300;
            var barPadding = 0.05; //Padding for scalable bars
            var maxValue = 25;
            //initial dataset
            var dataset = [14, 5, 26, 23, 9, 21, 7, 19, 28, 16, 15, 24];
            //x axis
            var xScale = d3.scaleBand()
                .domain(d3.range(dataset.length))
                .range([0, w])
                .paddingInner(barPadding);

            //y axis
            var yScale = d3.scaleLinear()
                .domain([0, d3.max(dataset)])
                .range([h, 0]);

            //svg container
            var svg = d3.select("body")
                .append("svg")
                .attr("width", w)
                    .attr("height", h);

             // Drawing the bars
            function drawBars(data) {
                var bars = svg.selectAll("rect")
                .data(data, (d,i) => i);


                bars.enter()
                .append("rect")
                .attr("x", w) // Start from the right
                .attr("y", d => yScale(d))
                .attr("width", xScale.bandwidth())
                .attr("height", d => h - yScale(d))
                .attr("fill", "burlywood")
                .on("mouseover", function (event, d) {
                    d3.select(this)
                        .attr("fill", "chocolate");
                    
                    var xPosition = parseFloat(d3.select(this).attr("x")) + xScale.bandwidth() / 2;
                    var yPosition = parseFloat(d3.select(this).attr("y")) - 5;
                    
                svg.append("text")
                        .attr("id", "tooltip")
                        .attr("x", xPosition)
                        .attr("y", yPosition)
                        .attr("text-anchor", "middle")
                        .attr("font-size", "12px")
                        .attr("font-weight", "bold")
                        .attr("fill", "black")
                        .text(d);
                })
                
                .on("mouseout", function () {
                    d3.select(this)
                        .attr("fill", "burlywood");

                    d3.select("#tooltip").remove();
                })
                .merge(bars)
                .transition()
                .duration(500)
                .attr("x", (d, i) => xScale(i))
                .attr("y", d => yScale(d))
                .attr("height", d => h - yScale(d));

                bars.exit()
                .transition()
                .duration(500)
                .attr("x", w) // Move exiting bars to the right
                .remove();
            }

                    // Draw initial chart
                drawBars(dataset);

                    // Update data on button click
                d3.select("#addButton").on("click", function() {
                    var newNumber = Math.floor(Math.random() * maxValue);
                    dataset.push(newNumber); // Add new number to dataset
                    xScale.domain(d3.range(dataset.length)); // Update xScale domain
                    drawBars(dataset); // Redraw bars with updated data
                });

                // Remove data
                d3.select("#removeButton").on("click", function() {
                    dataset.shift(); // Remove the first element
                    xScale.domain(d3.range(dataset.length)); // Update xScale domain
                    drawBars(dataset); // Redraw bars with updated data
                });
            </script>
