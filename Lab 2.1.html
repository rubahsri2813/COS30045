	<h1>Creating and Formatting Paragraph Elements with D3</h1>
    
    <script>
    
    var dataset = [14, 5, 26, 23, 9];
    var color1=d3.color("red");

        d3.select("body").selectAll("p")
        .data(dataset)
        .enter()
        .append("p")
        .style("color",function (d) {
            if(d>10){
                return "red"
            }
        })
        .text(function(d) {
            if(d > 10){
                return "Warning: Ruby watched " +d+ "cat videos today.";
            }
            else{
                return "Ruby watched " + d + " cat videos today.";
            }
        });

    </script>
