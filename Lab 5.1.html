    <script>

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }

    <script>
        var w = 500;
		var h = 300;
		var barPadding = 0.05; //Padding for scalable bars
        var maxValue = 25;
<!-- initial dataset for Bar Graph-->
		var dataset = [14, 5, 26, 23, 9, 21, 7, 19, 28, 16, 15, 24];
        //x axis
        var xScale = d3.scaleBand()
        .domain(d3.range(dataset.length))
        .range([0,w])
        .paddingInner(barPadding);
        
        //y axis
        var yScale = d3.scaleLinear()
        .domain([0,d3.max(dataset)])
        .range([h,0]);
        
		var svg = d3.select("body")
		.append("svg")
		.attr("width", w)
		.attr("height", h);

		// Drawing the bars
        function drawBars(data) {
            svg.selectAll("rect")
                .data(data)
                .join("rect")
                .attr("x", (d, i) => xScale(i))
                .attr("y", d => yScale(d))
                .attr("width", xScale.bandwidth())
                .attr("height", d => h - yScale(d))
                .attr("fill", "black");

            // Add or update the labels
            svg.selectAll("text")
                .data(data)
                .join("text")
                .text(d => d)
                .attr("x", (d, i) => xScale(i) + xScale.bandwidth() / 2)
                .attr("y", d => yScale(d) + 15)
                .attr("font-size", "12px")
                .attr("fill", "white")
                .attr("text-anchor", "middle");
        }

        // Draw initial chart
        drawBars(dataset);
        
        // Update data on button click
        d3.select("#updateButton").on("click", function () {
            var numValues = dataset.length;
            dataset = [];  // Clear the dataset
            for (var i = 0; i < numValues; i++) {
                var newNumber = Math.floor(Math.random() * maxValue);
                dataset.push(newNumber);  // Push random values between 0 and 24
            }

            // Update yScale domain with new maximum
            yScale.domain([0, d3.max(dataset)]);

            // Redraw the bars with new data
            drawBars(dataset);
        });
    </script>
